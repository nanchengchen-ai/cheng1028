[project]
name = "gesture-photo-viewer"
version = "0.1.0"
description = "Browser camera gesture controlled photo viewer"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "streamlit>=1.41,<2",
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cheng1028"
module-root = "src"
